<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ricochet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F0EFE9; --card:#F8F7F3; --ink:#1A1B16; --soft:#5F6157;
  --rule:#D7D5CB; --mark:#E2F25C; --flag:#B5431F;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'Newsreader',Georgia,serif;font-size:17px;line-height:1.6;padding:0 20px 60px}
.wrap{max-width:820px;margin:0 auto}
.ui,h1,h2,h3,button,.tab{font-family:'Archivo',system-ui,sans-serif;letter-spacing:-0.02em}

.top{display:flex;align-items:baseline;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--rule);margin-bottom:32px}
.top a{color:var(--soft);text-decoration:none;font-family:'Archivo',sans-serif;font-size:14px}
.top a:hover{color:var(--ink)}
.brand{font-weight:700;font-size:19px}
.brand em{font-style:normal;background:var(--mark);padding:0 3px}

.quota{font-family:'Archivo',sans-serif;font-size:13px;color:var(--soft);margin-bottom:14px}
.quota b{color:var(--ink)}

.drop{border:1.5px dashed var(--rule);background:var(--card);padding:44px 20px;text-align:center;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--ink)}
.drop .hint{font-family:'Archivo',sans-serif;font-size:15px;font-weight:500}
.drop .sub{color:var(--soft);font-size:14px;margin-top:6px}
input[type=file]{display:none}

button{font-weight:600;font-size:15px;cursor:pointer}
.go{width:100%;padding:14px;margin-top:12px;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.go:disabled{background:transparent;color:var(--soft);cursor:not-allowed}

details{margin-top:18px;border-top:1px solid var(--rule);padding-top:14px}
summary{font-family:'Archivo',sans-serif;font-size:14px;color:var(--soft);cursor:pointer}
textarea{width:100%;min-height:150px;margin-top:12px;padding:14px;border:1px solid var(--rule);background:var(--card);
  color:var(--ink);font-family:'Newsreader',Georgia,serif;font-size:16px;resize:vertical}
textarea:focus{outline:none;border-color:var(--ink)}
.go.alt{background:transparent;color:var(--ink)}

.bar{display:none;margin-top:14px}
.bar .track{height:6px;background:var(--rule)}
.bar .fill{height:100%;width:0;background:var(--ink);transition:width .2s}
.bar .label{font-family:'Archivo',sans-serif;font-size:13px;color:var(--soft);margin-top:8px}

.msg{margin-top:16px;padding:14px 16px;border:1px solid var(--flag);border-left-width:4px;background:var(--card);font-size:15.5px;display:none}

.res{display:none;margin-top:34px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--rule);margin-bottom:20px}
.tab{background:none;border:0;padding:0 0 9px;color:var(--soft);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px;font-weight:500}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.out{white-space:pre-wrap;word-wrap:break-word}
.tweet{padding:12px 0;border-bottom:1px solid var(--rule);position:relative}
.tweet:last-child{border:0}
.tweet .n{font-family:'Archivo',sans-serif;font-size:12px;color:var(--soft);display:block;margin-bottom:4px}
.copy{margin-top:16px;padding:8px 16px;border:1px solid var(--rule);background:var(--card);color:var(--ink)}
.copy:hover{border-color:var(--ink)}
.verif{margin-top:22px;border:1px solid var(--ink);border-left:4px solid var(--flag);background:var(--card);padding:14px 16px;font-size:15px}
.verif b{font-family:'Archivo',sans-serif;font-size:12px;color:var(--flag);display:block;margin-bottom:6px}
.src{margin-top:26px;font-size:14.5px;color:var(--soft)}
.src summary{font-size:13px}

.paywall{display:none;text-align:center;padding:56px 20px;border:1px solid var(--ink);background:var(--card);margin-top:40px}
.paywall h2{font-size:26px;margin-bottom:12px}
.paywall p{color:var(--soft);margin-bottom:24px}
.paywall .amt{font-family:'Archivo',sans-serif;font-size:46px;font-weight:700;letter-spacing:-.04em}
.paywall .amt span{font-family:'Newsreader',serif;font-size:16px;font-weight:400;color:var(--soft);letter-spacing:0}
.paywall .pay{margin-top:20px;padding:14px 34px;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.paywall .fine{font-size:13px;color:var(--soft);margin-top:14px}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hidden{display:none}
@media(max-width:600px){body{font-size:16px}.drop{padding:34px 16px}}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">Ric<em>o</em>chet</div>
    <a href="/">Retour</a>
  </header>

  <div id="app">
    <div class="quota" id="quota"></div>

    <div class="drop" id="drop">
      <div class="hint">Glisse ta vidéo, ou clique pour la choisir</div>
      <div class="sub" id="fileLabel">MP4, MOV ou un fichier audio. 40 minutes maximum.</div>
    </div>
    <input type="file" id="file" accept="video/*,audio/*">
    <button class="go" id="go" disabled>Générer les trois formats</button>

    <div class="bar" id="bar">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="label" id="barLabel">Envoi</div>
    </div>

    <details>
      <summary>J'ai déjà la transcription</summary>
      <textarea id="text" placeholder="Colle le texte de ta vidéo."></textarea>
      <button class="go alt" id="goText">Générer depuis le texte</button>
    </details>

    <div class="msg" id="msg"></div>

    <div class="res" id="res">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-p="tw">Thread X</button>
        <button class="tab" role="tab" aria-selected="false" data-p="li">LinkedIn</button>
        <button class="tab" role="tab" aria-selected="false" data-p="sh">Shorts</button>
      </div>
      <div id="tw"></div>
      <div id="li" class="out hidden"></div>
      <div id="sh" class="out hidden"></div>
      <button class="copy" id="copy">Copier</button>

      <div id="verif"></div>

      <details class="src">
        <summary>Transcription</summary>
        <div class="out" id="transcript" style="margin-top:10px"></div>
      </details>
    </div>
  </div>

  <div class="paywall" id="paywall">
    <h2>Tu as utilisé tes essais</h2>
    <p>Passe en illimité pour continuer.</p>
    <div class="amt">29 €<span> / mois</span></div>
    <button class="pay" id="pay">S'abonner</button>
    <div class="fine">Paiement par Stripe. Résiliable en un clic.</div>
  </div>

</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var fichier = null, statut = 'free', restant = 3, data = null, ongletActif = 'tw';

  var cid = localStorage.getItem('rico_cid');
  if(!cid){ cid = 'cid-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2); localStorage.setItem('rico_cid', cid); }

  /* ---------- statut ---------- */
  fetch('/api/status', { headers: { 'X-Client-ID': cid } })
    .then(function(r){ return r.json(); })
    .then(function(d){
      statut = d.status; restant = d.remaining;
      majQuota();
      var p = new URLSearchParams(location.search);
      if(p.get('success') === '1'){ history.replaceState(null,'','/app.html'); }
    })
    .catch(function(){ $('quota').textContent = 'Connexion au serveur impossible.'; });

  function majQuota(){
    $('quota').innerHTML = statut === 'active'
      ? 'Abonnement actif'
      : 'Essais restants : <b>' + restant + '</b>';
  }

  /* ---------- fichier ---------- */
  var drop = $('drop');
  drop.addEventListener('click', function(){ $('file').click(); });
  drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', function(){ drop.classList.remove('over'); });
  drop.addEventListener('drop', function(e){
    e.preventDefault(); drop.classList.remove('over');
    if(e.dataTransfer.files[0]) prendre(e.dataTransfer.files[0]);
  });
  $('file').addEventListener('change', function(){ if(this.files[0]) prendre(this.files[0]); });

  function prendre(f){
    var mo = f.size / 1048576;
    if(mo > 200){ erreur('Fichier trop lourd (' + mo.toFixed(0) + ' Mo). La limite est de 200 Mo.'); return; }
    fichier = f;
    $('fileLabel').textContent = f.name + ' — ' + mo.toFixed(1) + ' Mo';
    $('go').disabled = false;
    cacherMsg();
  }

  /* ---------- messages ---------- */
  function erreur(t){ $('msg').textContent = t; $('msg').style.display = 'block'; }
  function cacherMsg(){ $('msg').style.display = 'none'; }

  function occupe(v){
    $('go').disabled = v || !fichier;
    $('goText').disabled = v;
  }

  /* ---------- envoi fichier ---------- */
  $('go').addEventListener('click', function(){
    if(!fichier) return;
    if(statut !== 'active' && restant <= 0){ paywall(); return; }

    cacherMsg(); $('res').style.display = 'none'; occupe(true);
    $('bar').style.display = 'block'; $('fill').style.width = '0'; $('barLabel').textContent = 'Envoi de la vidéo';

    var fd = new FormData(); fd.append('file', fichier);
    var xhr = new XMLHttpRequest();

    xhr.upload.addEventListener('progress', function(e){
      if(!e.lengthComputable) return;
      var pct = Math.round(e.loaded / e.total * 100);
      $('fill').style.width = pct + '%';
      $('barLabel').textContent = 'Envoi de la vidéo — ' + pct + ' %';
      if(pct === 100) $('barLabel').textContent = 'Transcription puis écriture, environ une minute';
    });

    xhr.addEventListener('load', function(){
      $('bar').style.display = 'none'; occupe(false);
      var d = null;
      try { d = JSON.parse(xhr.responseText); } catch(e){}
      if(xhr.status >= 200 && xhr.status < 300 && d) return afficher(d);
      if(d && d.error === 'QUOTA_EXCEEDED') return paywall();
      erreur(d && d.message ? d.message : 'Le serveur a renvoyé une erreur (' + xhr.status + ').');
    });

    xhr.addEventListener('error', function(){
      $('bar').style.display = 'none'; occupe(false);
      erreur('Connexion interrompue pendant l\'envoi. Réessaie.');
    });

    xhr.open('POST', '/from-media');
    xhr.setRequestHeader('X-Client-ID', cid);   // pas de Content-Type : le navigateur gère le boundary
    xhr.send(fd);
  });

  /* ---------- envoi texte ---------- */
  $('goText').addEventListener('click', function(){
    var t = $('text').value.trim();
    if(t.length < 40){ erreur('Texte trop court. Il faut au moins quelques phrases.'); return; }
    if(statut !== 'active' && restant <= 0){ paywall(); return; }

    cacherMsg(); $('res').style.display = 'none'; occupe(true);
    $('bar').style.display = 'block'; $('fill').style.width = '100%'; $('barLabel').textContent = 'Écriture en cours';

    fetch('/from-text', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Client-ID': cid },
      body: JSON.stringify({ text: t })
    })
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
    .then(function(x){
      $('bar').style.display = 'none'; occupe(false);
      if(x.ok) return afficher(x.d);
      if(x.d.error === 'QUOTA_EXCEEDED') return paywall();
      erreur(x.d.message || 'La génération a échoué.');
    })
    .catch(function(){
      $('bar').style.display = 'none'; occupe(false);
      erreur('Connexion au serveur impossible.');
    });
  });

  /* ---------- affichage ---------- */
  function afficher(d){
    data = d;

    $('tw').innerHTML = '';
    (d.twitter_thread || []).forEach(function(t, i){
      var el = document.createElement('div');
      el.className = 'tweet';
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = (i + 1) + ' / ' + d.twitter_thread.length + ' — ' + t.length + ' caractères';
      var p = document.createElement('div');
      p.textContent = t;
      el.appendChild(n); el.appendChild(p);
      $('tw').appendChild(el);
    });

    $('li').textContent = d.linkedin_post || '';
    $('sh').textContent = d.shorts_script || '';
    $('transcript').textContent = d.transcript || '';

    var v = $('verif'); v.innerHTML = '';
    (d.verification || []).forEach(function(x){
      var box = document.createElement('div');
      box.className = 'verif';
      var b = document.createElement('b'); b.textContent = 'À vérifier avant de publier';
      var p = document.createElement('div');
      p.textContent = x.affirmation + ' — ' + (x.note || '');
      box.appendChild(b); box.appendChild(p);
      v.appendChild(box);
    });

    if(typeof d.remaining === 'number'){ restant = d.remaining; majQuota(); }
    $('res').style.display = 'block';
    $('res').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---------- onglets ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
    t.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(x){ x.setAttribute('aria-selected','false'); });
      t.setAttribute('aria-selected','true');
      ongletActif = t.dataset.p;
      ['tw','li','sh'].forEach(function(id){ $(id).classList.toggle('hidden', id !== ongletActif); });
    });
  });

  /* ---------- copie ---------- */
  $('copy').addEventListener('click', function(){
    if(!data) return;
    var txt = ongletActif === 'tw' ? (data.twitter_thread || []).join('\n\n')
            : ongletActif === 'li' ? data.linkedin_post
            : data.shorts_script;
    var btn = this;
    navigator.clipboard.writeText(txt).then(function(){
      btn.textContent = 'Copié';
      setTimeout(function(){ btn.textContent = 'Copier'; }, 1500);
    });
  });

  /* ---------- paywall ---------- */
  function paywall(){
    $('app').style.display = 'none';
    $('paywall').style.display = 'block';
  }

  $('pay').addEventListener('click', function(){
    var b = this; b.disabled = true; b.textContent = 'Redirection';
    fetch('/api/create-checkout-session', { method: 'POST', headers: { 'X-Client-ID': cid } })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.url) location.href = d.url;
        else throw new Error(d.error || 'erreur');
      })
      .catch(function(){
        b.disabled = false; b.textContent = "S'abonner";
        erreur('Le paiement est indisponible pour le moment.');
      });
  });
})();
</script>
</body>
</html>
